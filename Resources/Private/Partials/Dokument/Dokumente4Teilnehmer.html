<div class="fframe" id="AnkerDokumente"><h2><f:translate key="dokumente" /> in '{dokumentpfad}'</h2>
	<f:if condition="{dokumente}"><f:then>
        <div class="dok-control-panel">
            <button class="open-all-btn" onclick="openAllTableLinks()">
                🔗 Alle Dokumente in neuen Tabs öffnen
            </button>
            <div class="status" id="status"></div>
        </div>
		<table class="doks">
			<thead>
				<th>Dateiname</th>
				<th>Dateigröße</th>
				<th>Kurzbeschreibung</th>
				<th></th>
			</thead>
			
			<f:for each="{dokumente}" as="dokument" iteration="iter">
					<tr>
						<td>
							<f:if condition="{filesizes.{iter.index}} == 0"><f:then>
								Datei {dokument.name} wurde nicht vollständig hochgeladen oder ist defekt.
							</f:then><f:else>
								<f:link.action action="openfile" arguments="{dokument : dokument, teilnehmer : teilnehmer}" controller="Dokument" target="_blank">{dokument.name}</f:link.action>
							</f:else>
							</f:if>
						</td>
						<td>{filesizes.{iter.index}}</td>
						
						<f:form id="dokumenteform1">
							<f:form.hidden id="dokid{iter.index}" name="dokid{iter.index}" value="{dokument.uid}" />
							<td><f:form.textfield id="dokdescrinput{iter.index}" name="dokdescrinput{iter.index}" property="beschreibung" value="{dokument.beschreibung}" size="50" /></td>
							
							<script type="text/javascript">
								<f:format.raw>
									$(document).on('blur', '#dokdescrinput{iter.index}', function () {
										asyncupdatedokdescription(document.getElementById('dokdescrinput{iter.index}'),document.getElementById('dokid{iter.index}'));
									});
								</f:format.raw>									
							</script>

						</f:form>						
						<td><f:link.action class="iconbuttons" action="deleteFileBackend" controller="Dokument" arguments="{dokument : dokument, teilnehmer : teilnehmer, calleraction : calleraction, callercontroller : callercontroller, callerpage : callerpage, thisaction : thisaction}" onclick="return confirm('Wirklich löschen?');" ><img src="/typo3conf/ext/iqtp13db/Resources/Public/Icons/delete-640.png" width="32" height="32" alt="Löschen" /></f:link.action></td>
					</tr>		
			</f:for>
		</table>	
		<div id="response"></div>
		<div style="font-size: 0.8rem;">Speichergröße: 30 MB, Auslastung: {speicherbelegung} %</div>
	</f:then></f:if>
  
  <f:render partial="Dokument/UploadDokFeld4Backend" arguments="{teilnehmer:teilnehmer, calleraction : calleraction, callercontroller : callercontroller, callerpage : callerpage, thisaction : thisaction}" />
  
</div>

<script>
	const dropzone = document.getElementById('dropzone');
	const fileInput = document.getElementById('fileInput');
	
    $( "#opensysfileupload" ).on( "click", function() {
	  $("#fileInput").click();
	});
		
	dropzone.addEventListener('dragover', (e) => {
	    e.preventDefault();
	    dropzone.classList.add('dragging');
	});	
	dropzone.addEventListener('dragleave', () => {
	    dropzone.classList.remove('dragging');	    
	});	
	dropzone.addEventListener('drop', (e) => {
	    e.preventDefault();
	    dropzone.classList.remove('dragging');
	    fileInput.files = e.dataTransfer.files;	    
	    $("#overlay").show();	    
	    document.getElementById('fileuploadform').submit();
	});
	
	fileInput.addEventListener('change', () => {			
		document.getElementById('fileuploadform').submit();
	});
	
	
	
	function openAllTableLinks() {
	    // Alle Links in Tabellenzellen finden, die target="_blank" haben
	    const tableLinks = document.querySelectorAll('table.doks td a[target="_blank"]');
	    
	    const statusElement = document.getElementById('status');
	    
	    // Bestätigung vom Benutzer einholen
	    const confirmation = confirm(`Sollen alle ${tableLinks.length} Dokumente in neuen Tabs geöffnet werden?\n\nHinweis: Ihr Browser könnte Popup-Blocker aktiviert haben.`);
	    
	    if (!confirmation) {
	        statusElement.textContent = 'Vorgang abgebrochen.';
	        statusElement.style.color = '#ffc107';
	        return;
	    }
	    
	    let openedCount = 0;
	    let failedCount = 0;
	    
	    // Links mit kleiner Verzögerung öffnen, um Browser-Limits zu vermeiden
	    tableLinks.forEach((link, index) => {
	        setTimeout(() => {
	            try {
	                // Link in neuem Tab öffnen
	                const newWindow = window.open(link.href, '_blank');
	                
	                // Prüfen, ob das Fenster erfolgreich geöffnet wurde
	                if (newWindow) {
	                    openedCount++;
	                    console.log(`Dokument ${index + 1} geöffnet: ${link.href}`);
	                } else {
	                    failedCount++;
	                    console.warn(`Dokument ${index + 1} konnte nicht geöffnet werden (Popup-Blocker?): ${link.href}`);
	                }
	                
	                // Status aktualisieren nach dem letzten Link
	                if (index === tableLinks.length - 1) {
	                    setTimeout(() => {
	                        updateFinalStatus(openedCount, failedCount, tableLinks.length);
	                    }, 500);
	                }
	                
	            } catch (error) {
	                failedCount++;
	                console.error(`Fehler beim Öffnen von Dokument ${index + 1}:`, error);
	                
	                if (index === tableLinks.length - 1) {
	                    setTimeout(() => {
	                        updateFinalStatus(openedCount, failedCount, tableLinks.length);
	                    }, 100);
	                }
	            }
	        }, index * 100); // 100ms Verzögerung zwischen den Links
	    });
	    
	    // Sofortiges Feedback
	    statusElement.textContent = `Öffne ${tableLinks.length} Links...`;
	    statusElement.style.color = '#007bff';
	}
	
	function updateFinalStatus(opened, failed, total) {
	    const statusElement = document.getElementById('status');
	    
	    if (failed === 0) {
	        statusElement.textContent = `✅ Alle ${opened} Dokumente erfolgreich geöffnet!`;
	        statusElement.style.color = '#28a745';
	    } else if (opened > 0) {
	        statusElement.textContent = `⚠️ ${opened} Dokumente geöffnet, ${failed} fehlgeschlagen (möglicherweise durch Popup-Blocker)`;
	        statusElement.style.color = '#ffc107';
	    } else {
	        statusElement.textContent = `❌ Keine Dokumente konnten geöffnet werden. Bitte Popup-Blocker prüfen.`;
	        statusElement.style.color = '#dc3545';
	    }
	}
	
	// Optional: Keyboard-Shortcut (Ctrl+Shift+O)
	document.addEventListener('keydown', function(event) {
	    if (event.ctrlKey && event.shiftKey && event.key === 'O') {
	        event.preventDefault();
	        openAllTableLinks();
	    }
	});
	
	// Beim Laden der Seite die Anzahl der Dokumente anzeigen
	window.addEventListener('load', function() {
	    const tableLinks = document.querySelectorAll('table.doks td a[target="_blank"]');
	    console.log(`${tableLinks.length} Links mit target="_blank" in Tabellenzellen gefunden.`);
	});

	
</script>
