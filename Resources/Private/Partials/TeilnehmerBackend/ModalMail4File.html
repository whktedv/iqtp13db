<dialog id="mail4filemodal{dokument.uid}" class="mail4externemail-modal">
	<div class="mail4externmodal-content">
		<div class="mail4externmodal-header">
			<b>Download der Datei {dokument.name}</b>
			<button type="button" class="mail4externclose-btn"
				onclick="closeFileLinkModal({dokument.uid})">&times;</button>
		</div>
	
		<div class="mail4externmodal-body">		
			<f:if condition="{teilnehmer.gebdat} != ''"><f:then>
				<div class="mail4externlinkdiv">
					<a href="#AnkerDokumente" onclick="filelinkKopieren({dokument.uid})"><svg
							clip-rule="evenodd" width="50px" height="50px" fill-rule="evenodd"
							stroke-linejoin="round" stroke-miterlimit="2" viewBox="0 0 24 24"
							xmlns="http://www.w3.org/2000/svg">
							<path
								d="m6 19v2c0 .621.52 1 1 1h2v-1.5h-1.5v-1.5zm7.5 3h-3.5v-1.5h3.5zm4.5 0h-3.5v-1.5h3.5zm4-3h-1.5v1.5h-1.5v1.5h2c.478 0 1-.379 1-1zm-1.5-1v-3.363h1.5v3.363zm0-4.363v-3.637h1.5v3.637zm-13-3.637v3.637h-1.5v-3.637zm11.5-4v1.5h1.5v1.5h1.5v-2c0-.478-.379-1-1-1zm-10 0h-2c-.62 0-1 .519-1 1v2h1.5v-1.5h1.5zm4.5 1.5h-3.5v-1.5h3.5zm3-1.5v-2.5h-13v13h2.5v-1.863h1.5v3.363h-4.5c-.48 0-1-.379-1-1v-14c0-.481.38-1 1-1h14c.621 0 1 .522 1 1v4.5h-3.5v-1.5z"
								fill-rule="nonzero" /></svg>Link in Zwischenablage kopieren</a>								
				</div>	
				<f:link.action id="downloadlinkforFile{dokument.uid}" extensionName="iqtp13db"
						pluginName="Iqtp13dbwebapp" controller="Teilnehmer"
						action="editextern" arguments="{code:teilnehmer.verificationCode, filedownload : dokument.uid}"
						absolute="true" pageUid="{anmeldeditseite}"></f:link.action>
				<div id="mail4externfeedback{dokument.uid}"
						class="divmail4externfeedback"></div>			
			</f:then><f:else>
				<div class="errormessage">Kein Geburtsdatum für Ratsuchende(n) hinterlegt, Link senden nicht möglich!</div>
			</f:else>
			</f:if>
		</div>
	</div>
</dialog>
