<f:layout name="Default" />
<f:section name="HeaderAssets">
  		<link rel="stylesheet" href="{f:uri.resource(path: 'CSS/customtp13dbadmin.css')}"/>  		
</f:section>

<f:section name="main">
 
<f:if condition="{showabschluesse} == '1'">
<f:then>
	<script>
		(function($) {
		    $(document).ready(function() {
		    	location.href = "#AnkerAbschluesse";
		    });
		})(jQuery);		
	</script>
</f:then>
<f:else>
	<f:if condition="{showdokumente} == '1'">
	<f:then>
		<script>
			(function($) {
			    $(document).ready(function() {
			         location.href = "#AnkerDokumente";
			    });
			})(jQuery);		
		</script>
	</f:then>
	<f:else>
		<script type="text/javascript">
			$(document).ready(function () {
		
			    if (localStorage.getItem("iqtp13-{teilnehmer.uid}-quote-scroll") != null) {
			        $(window).scrollTop(localStorage.getItem("iqtp13-{teilnehmer.uid}-quote-scroll"));
			    }
			
			    $(window).on("scroll", function() {
			        localStorage.setItem("iqtp13-{teilnehmer.uid}-quote-scroll", $(window).scrollTop());
			    });
		
		  	});
		</script>
	</f:else>
	</f:if>
</f:else>
</f:if>

<!-- Modal - HTML -->
	<dialog id="infomodal">
	  <h3>Info</h3>
	  <div id="modaltext"></div>
	  <button id="okModal">OK</button>
	</dialog>
	
<f:form id="teilnehmerform" action="update" controller="Backend" name="teilnehmer" object="{teilnehmer}" arguments="{abschluss: abschluss, calleraction: calleraction, callercontroller : callercontroller, callerpage : callerpage, newnacherfassung : newnacherfassung, searchparams : searchparams}" >
	
	<div class="buttonmenu">
		<div class="toplinkbuttons">
			<f:form.button type="submit" id="savebutton1">Speichern</f:form.button>
			<f:link.action id="linkloadoverlay-back" class="linkbuttons" action="{calleraction}" controller="{callercontroller}" arguments="{callerpage : callerpage, tn : teilnehmer, searchparams : searchparams}">Zurück zur Liste</f:link.action>
		</div>		
		<div class="ankerbuttons">		
			<a href="#AnkerBeratung" class="linkbuttons buttonberatung" >Beratung anzeigen</a>
			<f:if condition="{teilnehmer.beratungsstatus} > 1">
				<a href="#AnkerFolgekontakte" class="linkbuttons buttonfolgekontakte" >Folgekontakte anzeigen</a>
			</f:if>
			<a href="#AnkerAbschluesse" class="linkbuttons buttonabschluesse" >Abschlüsse anzeigen</a>
			<f:if condition="{teilnehmer.anonym} != '1'">
				<a href="#AnkerDokumente" class="linkbuttons buttondokumente" >Dokumente anzeigen</a>
			</f:if>
		</div>
	</div>
	
	<div class="edit-eingabefelder">
	<f:if condition="{edituserfield} != ''"><div class="edituserfield">Datensatz wird seit <strong>{edittstampfield} Uhr</strong> von {edituserfield} bearbeitet</div></f:if>
	<h1>Ratsuchende*n bearbeiten UID: {teilnehmer.uid}</h1>
	
	<f:render partial="FormErrors" arguments="{object:Teilnehmer}" />
	<f:flashMessages />
	
		<f:render partial="TeilnehmerBackend/FormFields-Part1" arguments="{_all}" />
		
	 	<div id="AnkerBeratung">
	 		<f:render partial="TeilnehmerBackend/FormFields-Part2" arguments="{_all}" />
	 	</div>
 	</div>
 	
</f:form>

<f:if condition="{teilnehmer.beratungsstatus} > 1">
	<f:render partial="Folgekontakt/Folgekontakte4Teilnehmer" arguments="{teilnehmer : teilnehmer, folgekontakte: folgekontakte, calleraction: calleraction, callercontroller : callercontroller, callerpage : callerpage, thisaction : 'show'}" />
</f:if>

<f:render partial="Abschluss/Abschluss4Teilnehmer" arguments="{teilnehmer : teilnehmer, abschluesse: abschluesse, calleraction: calleraction, callercontroller : callercontroller, callerpage : callerpage, thisaction : 'edit', berufe:berufe, staaten:staaten, abschlussartarr : abschlussartarr, brancheunterkat : brancheunterkat}" />
<f:if condition="{teilnehmer.anonym} != '1'">
	<f:render partial="Dokument/Dokumente4Teilnehmer" arguments="{teilnehmer : teilnehmer, dokumente: dokumente, calleraction: calleraction, callercontroller : callercontroller, callerpage : callerpage, dokumentpfad : dokumentpfad, thisaction : 'edit', filesizes : filesizes, speicherbelegung : speicherbelegung, anmeldeditseite : anmeldeditseite}" />
</f:if>

<f:flashMessages as="flashMessages">
  <dl class="messages">
    <f:for each="{flashMessages}" as="flashMessage">
    	<ul class="typo3-messages">
    		<li class="alert alert-warning"><p class="alert-message">
				<f:format.html>{flashMessage.message}</f:format.html>
			</p></li></ul>
    </f:for>
  </dl>
</f:flashMessages>

<script>
	
	// Modal - JavaScript
	const modal = document.getElementById("infomodal");
	const modaltext = document.getElementById("modaltext");
	const okModal = document.getElementById("okModal");
	
	var dellink = '';
	var cancellink = '';

	function showModal(elem) {		
		title = elem.getAttribute("title");
		modaltext.innerHTML = "<p>" + title + "</p>";
		modal.showModal();
		return false;
	}
	

	okModal.addEventListener("click", () => {
		modal.close();	    
	});
	
</script>
</f:section>
