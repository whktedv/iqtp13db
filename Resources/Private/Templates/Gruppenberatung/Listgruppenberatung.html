<f:layout name="DefaultBackend" />
<f:section name="HeaderAssets">
  		<link rel="stylesheet" href="{f:uri.resource(path: 'CSS/customtp13dbadmin.css')}"/>
</f:section>

<f:section name="main">
 
<f:flashMessages />

<h1>Gruppennberatungen</h1>


<div class="buttonmenu">
	<div class="toplinkbuttons">
		<f:link.action class="linkbuttons" action="new" controller="Gruppenberatung" arguments="{calleraction: calleraction, callercontroller : callercontroller, callerpage : callerpage}">Neue Gruppenberatung</f:link.action>
	</div>
</div>

<div class="listgruppenberatungen">
	<table class="tx_iqtp13db">
		<tr>
			<th>Titel</th>
			<th>Datum</th>
			<th>Ort</th>
			<th></th>
			<th></th>
		</tr>
		<f:for each="{gruppenberatungen}" as="gruppenberatung" iteration="it">
			<tr>
				<td><f:link.action action="show" arguments="{gruppenberatung : gruppenberatung, calleraction: calleraction, callercontroller : callercontroller, callerpage : callerpage}" title="Show">{gruppenberatung.titel}</f:link.action></td>
				<td><f:format.date format="d.m.Y">{gruppenberatung.datum}</f:format.date></td>
				<td>{gruppenberatung.ort}</td>
				<td><f:link.action action="edit" arguments="{gruppenberatung : gruppenberatung, calleraction: calleraction, callercontroller : callercontroller, callerpage : callerpage}" title="Bearbeiten"><img src="/fileadmin/template/images/iq-webapp_bearbeiten.svg" alt="Bearbeiten" width="30" height="30"/></f:link.action></td>
				<td><f:link.action action="delete" arguments="{gruppenberatung : gruppenberatung, calleraction: calleraction, callercontroller : callercontroller, callerpage : callerpage}" onclick="return confirm('Wirklich löschen?');" title="Löschen"><img src="/fileadmin/template/images/iq-webapp_loeschen.svg" width="30" height="30" alt="Löschen" /></f:link.action></td>			
			</tr>		
		</f:for>
	</table>
</div>
</f:section>
