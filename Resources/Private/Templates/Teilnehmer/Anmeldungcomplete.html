
<f:layout name="Default" />

<f:section name="main">
<h1><f:translate key="fragebogen" /> 4 / 4</h1>

<div id="dialog-confirm" title="Webapp - IQ Anerkennungsberatung">
  <p><span class="ui-icon ui-icon-alert"></span><f:translate key="dialoganmeldungabbrechen" /></p>
</div>

<f:flashMessages />
 
<f:form.validationResults for="{object}">
	<f:if condition="{validationResults.flattenedErrors}">
		<div class="error">
			&nbsp;<b><f:translate key="errormessage" /></b>
		</div>
	</f:if>
</f:form.validationResults>
    
<div class="framedokumente">
	<div id="AnkerDokumente" class="fframe formdokument">		
		<f:render partial="Dokument/Dokumente4Anmeldung" arguments="{teilnehmer : teilnehmer, dokumente: dokumente, foldersize : foldersize}" />
	</div>
</div>

<hr>
<f:form id="teilnehmerform" action="anmeldungcompleteredirect" name="teilnehmer" object="{teilnehmer}">
	
	<f:form.button type="submit" id="zurueckbutton" name="btnzurueck"><f:translate key="zurueck" /></f:form.button>
	
	<f:form.button type="submit" id="abbruchbutton" name="btncancel" class="abbruchbtn frontend" onclick="return btncancel_Click(0);"><f:translate key="abbruch" /></f:form.button>
	<f:form.button type="submit" id="savebutton1" name="btnAbsenden"><f:translate key="absenden" /></f:form.button>

	<f:translate key="hinweisdatenueberpruefen" /> 
	<f:render partial="Teilnehmer/PropertiesAnmeldung" arguments="{teilnehmer:teilnehmer, staaten:staaten}" />
	
	<f:for each="{abschluesse}" as="abschluss" iteration="iter">
		<f:render partial="Abschluss/PropertiesAnmeldung" arguments="{abschluss:abschluss, iter: iter, staaten:staaten, abschlussartarr : abschlussartarr, brancheunterkat : brancheunterkat}" />
	</f:for>
	
	<f:form.button type="submit" id="zurueckbutton" name="btnzurueck"><f:translate key="zurueck" /></f:form.button>
	<f:form.button type="submit" id="abbruchbutton" name="btncancel" class="abbruchbtn frontend" onclick="return btncancel_Click(0);"><f:translate key="abbruch" /></f:form.button>
	<f:form.button type="submit" id="savebutton1" name="btnAbsenden"><f:translate key="absenden" /></f:form.button>
</f:form>

<script>
	const dropzone1 = document.getElementById('dropzone1');
	const dropzone2 = document.getElementById('dropzone2');
	const dropzone3 = document.getElementById('dropzone3');
	const dropzone4 = document.getElementById('dropzone4');
	const fileInput1 = document.getElementById('fileInput1');
	const fileInput2 = document.getElementById('fileInput2');	
	const fileInput3 = document.getElementById('fileInput3');
	const fileInput4 = document.getElementById('fileInput4');
    
    $( "#opensysfileupload1" ).on( "click", function() {
	  $("#fileInput1").click();
	});
	$( "#opensysfileupload2" ).on( "click", function() {
	  $("#fileInput2").click();
	});
	$( "#opensysfileupload3" ).on( "click", function() {
	  $("#fileInput3").click();
	});
	$( "#opensysfileupload4" ).on( "click", function() {
	  $("#fileInput4").click();
	});
	
	dropzone1.addEventListener('dragover', (e) => {
	    e.preventDefault();
	    dropzone1.classList.add('dragging');
	});	
	dropzone1.addEventListener('dragleave', () => {
	    dropzone1.classList.remove('dragging');	    
	});	
	dropzone1.addEventListener('drop', (e) => {
	    e.preventDefault();
	    dropzone1.classList.remove('dragging');
	    fileInput1.files = e.dataTransfer.files;	    
	    $("#overlay").show();	    
	    document.getElementById('fileuploadform1').submit();
	});
	
	dropzone2.addEventListener('dragover', (e) => {
	    e.preventDefault();
	    dropzone2.classList.add('dragging');
	});	
	dropzone2.addEventListener('dragleave', () => {
	    dropzone2.classList.remove('dragging');	    
	});	
	dropzone2.addEventListener('drop', (e) => {
	    e.preventDefault();
	    dropzone2.classList.remove('dragging');
	    fileInput2.files = e.dataTransfer.files;	    
	    $("#overlay").show();	    
	    document.getElementById('fileuploadform2').submit();
	});
	
	dropzone3.addEventListener('dragover', (e) => {
	    e.preventDefault();
	    dropzone3.classList.add('dragging');
	});	
	dropzone3.addEventListener('dragleave', () => {
	    dropzone3.classList.remove('dragging');	    
	});	
	dropzone3.addEventListener('drop', (e) => {
	    e.preventDefault();
	    dropzone3.classList.remove('dragging');
	    fileInput3.files = e.dataTransfer.files;	    
	    $("#overlay").show();	    
	    document.getElementById('fileuploadform3').submit();
	});
	
	dropzone4.addEventListener('dragover', (e) => {
	    e.preventDefault();
	    dropzone4.classList.add('dragging');
	});	
	dropzone4.addEventListener('dragleave', () => {
	    dropzone4.classList.remove('dragging');	    
	});	
	dropzone4.addEventListener('drop', (e) => {
	    e.preventDefault();
	    dropzone4.classList.remove('dragging');
	    fileInput4.files = e.dataTransfer.files;	    
	    $("#overlay").show();	    
	    document.getElementById('fileuploadform4').submit();
	});

	fileInput1.addEventListener('change', () => {			
		document.getElementById('fileuploadform1').submit();
	});
	fileInput2.addEventListener('change', () => {			
		document.getElementById('fileuploadform2').submit();
	});
	fileInput3.addEventListener('change', () => {
		document.getElementById('fileuploadform3').submit();
	});
	fileInput4.addEventListener('change', () => {
		document.getElementById('fileuploadform4').submit();
	});

</script>
</f:section>
