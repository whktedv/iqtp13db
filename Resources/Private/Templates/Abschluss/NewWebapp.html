<f:layout name="Default" />

<f:section name="main">
<h1><f:translate key="fragebogen" /> 2 / 4</h1>

<div id="dialog-confirm" title="Webapp - IQ Anerkennungsberatung">
  <p><span class="ui-icon ui-icon-alert"></span><f:translate key="dialoganmeldungabbrechen" /></p>
</div>

<f:form.validationResults for="{object}">
	<f:if condition="{validationResults.flattenedErrors}">
		<div class="error">
			&nbsp;<b><f:translate key="errormessage" /></b>
		</div>
	</f:if>
</f:form.validationResults>

<!-- Modal - HTML -->
	<dialog id="infomodal">
	  <h3>Info</h3>
	  <div id="modaltext"></div>
	  <button id="okModal">OK</button>
	</dialog>

<div class="frameabschluesse">
	
	<f:render partial="FormErrors" arguments="{object:Abschluss}" />
	
	<div id="AnkerAbschluesse" class="fframe formabschluss">
		<f:if condition="{abschluesse-> f:count()} > 0">
			<h2><f:translate key="datenabschluss" /></h2>
		</f:if>
		<f:render partial="Abschluss/AbschlussListe4Anmeldung" arguments="{teilnehmer : teilnehmer, abschluesse: abschluesse, abschlussartarr : abschlussartarr}" />
	
		<f:form id="teilnehmerform" action="createWebapp" name="abschluss" object="{abschluss}" arguments="{teilnehmer: teilnehmer}">
			<div class="fframeabschluss-inner"><h2><f:translate key="neuerabschluss" /></h2>
				<f:render partial="Abschluss/FormFieldsAnmeldung" arguments="{abschlussjahre:abschlussjahre, staatenarr:staatenarr, abschlussartarr : abschlussartarr, brancheoberkat : brancheoberkat, brancheunterkat : brancheunterkat}" />
			</div>
			<f:form.button id="newabschlusszurueckbutton" name="btnzurueck"><f:translate key="zurueck" /></f:form.button>
			<f:form.button type="submit" id="savebutton1">{f:translate(key:'speichern')}</f:form.button>
		</f:form>
	</div>

</div>
<span style="color: #efefef; font-size: 0.8rem; float: right;">{beratungsstelle}</span>


<script>
	
	// Modal - JavaScript
	const modal = document.getElementById("infomodal");
	const modaltext = document.getElementById("modaltext");
	const okModal = document.getElementById("okModal");
	
	var dellink = '';
	var cancellink = '';

	function showModal(elem) {		
		title = elem.getAttribute("title");
		modaltext.innerHTML = "<p>" + title + "</p>";
		modal.showModal();
		return false;
	}
	

	okModal.addEventListener("click", () => {
		modal.close();	    
	});
	
</script>
</f:section>
